paths:
  /api/doctors/:
    get:
      summary: "Obtener doctores con paginación. Permite obtner páginas si se especifica [limit, page]"
      tags:
        - Doctors
      security:
        - cookieAuth: []
      description: >
        Solo admin y employee. Un doctor recibe 403: el listado incluye las fichas y horarios
        de los demás doctores.
      parameters:
        - name: search
          in: query
          required: false
          description: "Búsqueda por nombre, apellido, email y DNI"
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: "Ordenamiento por apellido (1=ASC, -1=DESC)"
          schema:
            type: integer
            enum: [1, -1]
        - name: page
          in: query
          required: false
          description: "Número de página"
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          description: "Límite de resultados por página"
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: "Doctores paginados obtenidos exitosamente"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Success"
                  doctors:
                    type: object
                    properties:
                      docs:
                        type: array
                        items:
                          $ref: "#/components/schemas/DoctorResponse"
                      totalDocs:
                        type: integer
                      limit:
                        type: integer
                      page:
                        type: integer
                      totalPages:
                        type: integer
                      hasNextPage:
                        type: boolean
                      hasPrevPage:
                        type: boolean
        "403":
          description: "Rol sin permiso (doctor)"
        "500":
          description: "Error en el servidor"

  /api/doctors/schedules:
    get:
      summary: "Obtener los horarios de los doctores"
      tags:
        - Doctors
      security:
        - cookieAuth: []
      description: >
        Admin y employee reciben los horarios de todos los doctores. Un doctor recibe solo el suyo
        (un array con un único elemento).
      responses:
        "200":
          description: "Horarios obtenidos exitosamente"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                          description: "Nombre y apellido"
                          example: "Juan Perez"
                        schedules:
                          $ref: "#/components/schemas/DoctorSchedules"
                        color:
                          type: string
                          example: "#336699"
                        frequency:
                          type: integer
                          description: "Duración de cada turno, en minutos"
                          example: 30
        "500":
          description: "Error en el servidor"

  /api/doctors/{id}:
    get:
      summary: "Obtener un doctor por ID"
      tags:
        - Doctors
      security:
        - cookieAuth: []
      description: >
        Admin y employee pueden pedir cualquier doctor. Un doctor solo puede pedir su propia ficha:
        con otro id recibe 403, exista o no ese doctor.
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del doctor"
          schema:
            type: string
      responses:
        "200":
          description: "El doctor se obtuvo exitosamente"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/DoctorResponse"
        "403":
          description: "Un doctor pidió la ficha de otro doctor"
        "404":
          description: "Doctor no encontrado o dado de baja"
        "500":
          description: "Error en el servidor"

    put:
      summary: "Actualizar un doctor (solo admin)"
      tags:
        - Doctors
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del doctor"
          schema:
            type: string
      description: >
        Actualización parcial de los datos profesionales: solo se modifican los campos enviados.
        Nombre, apellido y email son datos de la cuenta y se editan por PUT /api/users/{id},
        que actualiza usuario y doctor juntos. Si se envían aquí, se ignoran, igual que status y _id.
      requestBody:
        description: "Datos profesionales a actualizar"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorUpdate"
            example:
              phone: "+5492612345678"
              frequency: 30
      responses:
        "200":
          description: "El doctor se actualizó exitosamente"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/DoctorResponse"
        "400":
          description: "Datos inválidos (formato de algún campo, horarios o frecuencia fuera de rango)"
        "403":
          description: "Solo admin puede actualizar un doctor"
        "404":
          description: "Doctor no encontrado o dado de baja"
        "409":
          description: "DNI o matrícula profesional ya registrados en otro doctor"
        "500":
          description: "Error en el servidor"


components:
  schemas:
    DoctorUpdate:
      type: object
      description: "Todos los campos son opcionales: solo se actualizan los enviados"
      properties:
        dni:
          type: string
          description: "Número de DNI del doctor (único)"
        phone:
          type: string
          description: "Teléfono del doctor"
        professionalLicense:
          type: string
          description: "Matrícula profesional del doctor (única)"
        color:
          type: string
          description: "Color hexadecimal del doctor en la agenda"
          example: "#8f897fff"
        frequency:
          type: integer
          minimum: 5
          maximum: 240
          description: "Duración de cada turno, en minutos"
        schedules:
          $ref: "#/components/schemas/DoctorSchedules"

    DoctorSchedules:
      type: object
      description: >
        Semana completa de atención. Si se envía, deben venir los 6 días (monday a saturday)
        y reemplaza a la anterior. Cada día requiere inicio y fin en formato H:MM o HH:MM,
        con el fin posterior al inicio.
      additionalProperties: false
      required: [monday, tuesday, wednesday, thursday, friday, saturday]
      properties:
        monday:
          $ref: "#/components/schemas/DoctorScheduleDay"
        tuesday:
          $ref: "#/components/schemas/DoctorScheduleDay"
        wednesday:
          $ref: "#/components/schemas/DoctorScheduleDay"
        thursday:
          $ref: "#/components/schemas/DoctorScheduleDay"
        friday:
          $ref: "#/components/schemas/DoctorScheduleDay"
        saturday:
          $ref: "#/components/schemas/DoctorScheduleDay"
      example:
        monday: { start: "09:00", end: "18:00" }
        tuesday: { start: "09:00", end: "18:00" }
        wednesday: { start: "14:00", end: "18:00" }
        thursday: { start: "09:00", end: "18:00" }
        friday: { start: "09:00", end: "18:00" }
        saturday: { start: "09:00", end: "13:00" }

    DoctorScheduleDay:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
          example: "09:00"
        end:
          type: string
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
          example: "18:00"

    DoctorResponse:
      type: object
      properties:
        id:
          type: string
          description: "ID único del doctor"
          example: "676491db50d8d925d49439cc"
        name:
          type: string
          description: "Nombre del doctor"
          example: "Juan"
        lastName:
          type: string
          description: "Apellido del doctor"
          example: "Pérez"
        dni:
          type: string
          description: "Número de DNI del doctor"
          example: "12345678"
        phone:
          type: string
          description: "Teléfono del doctor"
          example: "+5492612345678"
        email:
          type: string
          format: email
          description: "Email del doctor"
          example: "juan.perez@clinica.com"
        professionalLicense:
          type: string
          description: "Matrícula profesional del doctor"
          example: "MP12345"
        status:
          type: boolean
          description: "true = activo, false = inactivo (no recibe turnos ni tiene días disponibles)"
          example: true

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: "JWT token almacenado en cookie HttpOnly"

security:
  - cookieAuth: []