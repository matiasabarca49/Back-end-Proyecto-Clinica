paths:
  /api/appointments:
    get:
      summary: "Obtener turnos, todos o filtrados con paginación"
      description: >
        Sin parámetros devuelve todos los turnos en un array. Con algún parámetro devuelve un objeto
        paginado. Un usuario con rol doctor solo ve sus propios turnos (el filtro doctor se ignora).
        Roles: admin, employee, doctor.
      tags:
        - Appointments
      security:
        - cookieAuth: []
      parameters:
        - name: doctor
          in: query
          required: false
          description: "ID del doctor, o texto a buscar en nombre, apellido, DNI o matrícula"
          schema:
            type: string
        - name: patient
          in: query
          required: false
          description: "ID del paciente, o texto a buscar en sus datos"
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: "Fecha inicial, incluida (YYYY-MM-DD)"
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: "Fecha final, incluida (YYYY-MM-DD)"
          schema:
            type: string
            format: date
        - name: room
          in: query
          required: false
          description: "Consultorio (búsqueda parcial)"
          schema:
            type: string
        - name: typeAppointment
          in: query
          required: false
          schema:
            type: string
            enum: ["consulta", "cirugia", "control", "tratamiento"]
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AppointmentStatus"
        - name: sort
          in: query
          required: false
          description: "Orden por fecha y horario (1=ASC, -1=DESC)"
          schema:
            type: integer
            enum: [1, -1]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: "Turnos obtenidos"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    oneOf:
                      - type: array
                        description: "Sin parámetros: todos los turnos"
                        items:
                          $ref: "#/components/schemas/AppointmentShortResponse"
                      - $ref: "#/components/schemas/AppointmentPage"
        "400":
          description: "Parámetros inválidos"
        "500":
          description: "Error en el servidor"

    post:
      summary: "Crear un turno"
      description: >
        Los slots son minutos del día (14:00 → 840), deben ser consecutivos y estar en la grilla del
        día del doctor: desde el inicio de su horario, de a su frecuencia, sin pasar el cierre. El domingo
        no se atiende, y un doctor inactivo no recibe turnos. No puede superponerse con otro turno activo del doctor ni del paciente (los
        cancelados no cuentan). La duración del turno se toma de la frecuencia actual del doctor.
        room es opcional, texto de hasta 50 caracteres; observations, texto de hasta 500. Un doctor
        solo puede reservar a su propio nombre. Roles: admin, employee, doctor.
      tags:
        - Appointments
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreate"
      responses:
        "201":
          description: "Turno creado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AppointmentShortResponse"
        "400":
          description: "Datos inválidos, el doctor está inactivo o no atiende ese día, slots fuera del horario o no consecutivos, o el doctor o el paciente ya tienen un turno en ese horario"
        "403":
          description: "Un doctor intenta reservar a nombre de otro doctor"
        "404":
          description: "Doctor o paciente no encontrado o dado de baja"
        "409":
          description: "Otro pedido reservó el mismo horario al mismo tiempo"
        "500":
          description: "Error en el servidor"

  /api/appointments/today:
    get:
      summary: "Obtener los turnos de hoy"
      description: >
        Primera página (10 turnos) de los turnos del día. Un usuario con rol doctor solo ve los suyos.
        Roles: admin, employee, doctor, dashboard.
      tags:
        - Appointments
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "Turnos de hoy"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AppointmentPage"
        "500":
          description: "Error en el servidor"

  /api/appointments/availability:
    get:
      summary: "Disponibilidad diaria de un doctor para el calendario"
      description: >
        Devuelve todos los días del rango, también los que el doctor no atiende, con la cantidad de
        slots de su horario, los ocupados por turnos activos y los libres. Usa la misma regla que la
        reserva, así que un slot libre se puede reservar. Máximo 62 días por consulta.
        Roles: admin, employee, doctor. Un doctor solo puede consultar su propia disponibilidad:
        con otro doctor recibe 403, exista o no.
      tags:
        - Appointments
      security:
        - cookieAuth: []
      parameters:
        - name: doctor
          in: query
          required: true
          description: "ID del doctor"
          schema:
            type: string
        - name: from
          in: query
          required: true
          description: "Fecha inicial, incluida (YYYY-MM-DD)"
          schema:
            type: string
            format: date
            example: "2026-11-01"
        - name: to
          in: query
          required: true
          description: "Fecha final, incluida (YYYY-MM-DD)"
          schema:
            type: string
            format: date
            example: "2026-11-30"
      responses:
        "200":
          description: "Disponibilidad del rango"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Availability"
        "400":
          description: "ID o fechas inválidos, fecha final anterior a la inicial o rango mayor a 62 días"
        "403":
          description: "Un doctor pidió la disponibilidad de otro doctor"
        "404":
          description: "Doctor no encontrado o dado de baja"
        "500":
          description: "Error en el servidor"

  /api/appointments/available/{id}:
    get:
      summary: "Grilla de un doctor en un día: slots libres y ocupados"
      description: >
        La grilla del día del doctor separada en slots libres (slots) y ocupados (occupiedSlots); juntos
        forman la grilla completa. Ocupado = se superpone con algún turno activo (los cancelados no
        cuentan). Si el doctor no atiende ese día o está inactivo, ambos vienen vacíos.
        Roles: admin, employee, doctor. Un doctor solo puede consultar su propia grilla:
        con otro doctor recibe 403, exista o no.
      tags:
        - Appointments
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del doctor"
          schema:
            type: string
        - name: day
          in: query
          required: true
          description: "Fecha (YYYY-MM-DD)"
          schema:
            type: string
            format: date
            example: "2026-11-02"
      responses:
        "200":
          description: "Slots libres del día"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                        example: "2026-11-02"
                      duration:
                        type: integer
                        description: "Duración de cada slot en minutos (frecuencia actual del doctor)"
                        example: 30
                      slots:
                        type: array
                        description: "Minuto del día en que empieza cada slot libre"
                        items:
                          type: integer
                        example: [540, 570, 660, 690]
                      occupiedSlots:
                        type: array
                        description: "Minuto del día en que empieza cada slot de la grilla que ya tiene un turno activo"
                        items:
                          type: integer
                        example: [600, 630]
        "400":
          description: "ID o fecha inválidos"
        "403":
          description: "Un doctor pidió la grilla de otro doctor"
        "404":
          description: "Doctor no encontrado o dado de baja"
        "500":
          description: "Error en el servidor"

  /api/appointments/nearest/{id}:
    get:
      summary: "Día más cercano con slots libres de un doctor"
      description: >
        Busca a partir de mañana, en los próximos 60 días, el primer día con algún slot libre.
        Roles: admin, employee, doctor. Un doctor solo puede consultar el suyo:
        con otro doctor recibe 403, exista o no.
      tags:
        - Appointments
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del doctor"
          schema:
            type: string
      responses:
        "200":
          description: "Día encontrado y sus slots libres"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                        example: "2026-11-02"
                      duration:
                        type: integer
                        example: 30
                      slots:
                        type: array
                        description: "Minuto del día en que empieza cada slot libre"
                        items:
                          type: integer
                        example: [540, 570]
                      slotsText:
                        type: array
                        items:
                          type: string
                        example: ["09:00 - 09:30", "09:30 - 10:00"]
        "400":
          description: "ID inválido"
        "403":
          description: "Un doctor pidió los turnos libres de otro doctor"
        "404":
          description: "Doctor no encontrado o dado de baja, o sin slots libres en los próximos 60 días"
        "500":
          description: "Error en el servidor"

  /api/appointments/{id}:
    get:
      summary: "Obtener un turno por ID"
      description: "Roles: admin, employee, doctor."
      tags:
        - Appointments
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del turno"
          schema:
            type: string
      responses:
        "200":
          description: "Turno encontrado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AppointmentResponse"
        "400":
          description: "ID inválido"
        "403":
          description: "Un doctor intenta ver un turno de otro doctor"
        "404":
          description: "Turno no encontrado"
        "500":
          description: "Error en el servidor"

    put:
      summary: "Actualizar un turno"
      description: >
        Un turno finalizado no se puede modificar. Si cambia el doctor, el paciente, la fecha o los
        slots, se aplican las mismas reglas que al crear y la duración pasa a ser la frecuencia actual
        del doctor. Si solo cambian sala, tipo u observaciones, no se vuelve a validar el horario.
        Roles: admin, employee, doctor.
      tags:
        - Appointments
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del turno"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "201":
          description: "Turno actualizado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AppointmentResponse"
        "400":
          description: "Datos inválidos o el nuevo horario no se puede reservar"
        "403":
          description: "Un doctor intenta editar un turno de otro doctor o pasárselo a otro"
        "404":
          description: "Turno, doctor o paciente no encontrado (o doctor/paciente dado de baja)"
        "409":
          description: "El turno está finalizado; se intenta mover (doctor, paciente, fecha u horario) un turno en espera o en consulta; cambió de estado o se eliminó mientras se editaba; o el horario se reservó al mismo tiempo"
        "500":
          description: "Error en el servidor"

  /api/appointments/{id}/check-in:
    patch:
      summary: "Registrar la llegada del paciente (pasa a waiting)"
      description: >
        Solo desde confirmed o called. Notifica al doctor por Socket.IO. Roles: admin, employee, doctor.
      tags:
        - Appointments
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del turno"
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                room:
                  type: string
                  description: "Consultorio asignado al llegar"
                  example: "Consultorio 2"
      responses:
        "200":
          description: "Turno en espera"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AppointmentShortResponse"
        "400":
          description: "El turno no está confirmado ni llamado, o el consultorio no es un texto de hasta 50 caracteres"
        "403":
          description: "Un doctor sobre un turno de otro doctor"
        "404":
          description: "Turno no encontrado"
        "409":
          description: "El turno cambió de estado mientras se hacía el check-in (ej: se canceló)"
        "500":
          description: "Error en el servidor"

  /api/appointments/{id}/call:
    patch:
      summary: "Llamar al paciente (pasa a called)"
      description: "Solo desde waiting. Notifica por Socket.IO. Roles: admin, doctor."
      tags:
        - Appointments
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del turno"
          schema:
            type: string
      responses:
        "200":
          description: "Turno llamado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AppointmentShortResponse"
        "400":
          description: "El turno no está en espera"
        "403":
          description: "Un doctor sobre un turno de otro doctor"
        "404":
          description: "Turno no encontrado"
        "409":
          description: "El turno dejó de estar en espera mientras se llamaba"
        "500":
          description: "Error en el servidor"

  /api/appointments/{id}/finalize:
    patch:
      summary: "Finalizar el turno (pasa a finalized)"
      description: >
        Solo desde called. Guarda el odontograma del turno en el del paciente y después finaliza el
        turno. Notifica por Socket.IO. Un turno finalizado ya no se puede editar. Roles: admin, doctor.
      tags:
        - Appointments
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del turno"
          schema:
            type: string
      responses:
        "200":
          description: "Turno finalizado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AppointmentShortResponse"
        "400":
          description: "El turno no está llamado"
        "403":
          description: "Un doctor sobre un turno de otro doctor"
        "404":
          description: "Turno o paciente no encontrado"
        "409":
          description: "El turno cambió mientras se finalizaba; se puede reintentar"
        "500":
          description: "Error en el servidor"

  /api/appointments/{id}/status:
    patch:
      summary: "Cambiar el estado del turno"
      description: >
        Para los estados que no tienen su propio endpoint. No se puede usar sobre un turno en espera,
        en consulta o finalizado (siguen su propio flujo). Un turno cancelado libera su horario: el
        registro se conserva, pero sus slots se pueden volver a reservar. Volver a confirmed un turno
        cancelado, ausente o reprogramado aplica las mismas reglas que reservar (incluido que el doctor y
        el paciente no estén dados de baja). Notifica por Socket.IO. Roles: admin, employee.
      tags:
        - Appointments
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del turno"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: ["confirmed", "noshow", "rescheduled", "canceled"]
                  example: "canceled"
      responses:
        "200":
          description: "Estado actualizado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AppointmentShortResponse"
        "400":
          description: "Estado inválido, o al reactivar un cancelado su horario ya no se puede reservar"
        "404":
          description: "Turno no encontrado, o al reabrirlo su doctor o paciente fue dado de baja"
        "409":
          description: "El turno está en espera, en consulta o finalizado, o cambió mientras se actualizaba"
        "500":
          description: "Error en el servidor"

  /api/appointments/{id}/odontogram:
    get:
      summary: "Obtener el odontograma del turno"
      description: >
        Devuelve los dientes tratados en el turno. Separado de GET /api/appointments/{id}
        porque son datos clínicos: solo admin y doctor.
      tags:
        - Appointments
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del turno"
          schema:
            type: string
      responses:
        "200":
          description: "Odontograma del turno"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppointmentTooth"
        "400":
          description: "ID inválido"
        "403":
          description: "Un doctor sobre un turno de otro doctor"
        "404":
          description: "Turno no encontrado"
        "500":
          description: "Error en el servidor"

    post:
      summary: "Agregar, reemplazar o quitar un diente en el odontograma del turno"
      description: >
        El odontograma del turno empieza vacío y guarda solo los dientes tratados en ese turno.
        El body trae el estado completo del diente después del tratamiento; si el diente ya está
        en el turno, se reemplaza. Si el diente llega sin tratar (todas las marcas en false y caries
        en "0"), se quita del odontograma del turno. Solo se permite mientras el turno está en
        consulta (called); al finalizar el turno (PATCH /api/appointments/{id}/finalize) el
        odontograma se guarda en el del paciente. Un doctor solo puede modificar los turnos que tiene asignados.
      tags:
        - Appointments
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del turno"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentTooth"
      responses:
        "200":
          description: "Odontograma del turno actualizado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppointmentTooth"
        "400":
          description: "Datos del diente o ID inválidos"
        "403":
          description: "El doctor no es el asignado al turno"
        "404":
          description: "Turno no encontrado"
        "409":
          description: "El turno no está en consulta (called) o cambió durante la operación"
        "500":
          description: "Error en el servidor"

components:
  schemas:
    AppointmentStatus:
      type: string
      description: "Estado del turno. Todos ocupan su horario salvo canceled"
      enum: ["pending", "confirmed", "waiting", "called", "noshow", "rescheduled", "finalized", "canceled"]
      example: "pending"

    AppointmentSlots:
      type: array
      description: >
        Minuto del día en que empieza cada slot (14:00 → 840). Deben ser consecutivos según la
        frecuencia del doctor: [840, 870] con 30 minutos es un turno de 14:00 a 15:00.
      items:
        type: integer
        minimum: 0
        maximum: 1439
      minItems: 1
      example: [840, 870]

    AppointmentTooth:
      type: object
      description: "Estado completo de un diente (toothSchema)"
      required: [tooth, caries, corona, extracted, allcaries, incurable, malposition, periodontal, inscrustration]
      properties:
        tooth:
          type: integer
          description: "Número de diente según sistema FDI"
          example: 16
        caries:
          type: object
          required: [vestibular, mesial, oclusal, distal, lingual]
          properties:
            vestibular: { type: string, enum: ["0", "1", "2"], example: "0" }
            mesial: { type: string, enum: ["0", "1", "2"], example: "0" }
            oclusal: { type: string, enum: ["0", "1", "2"], example: "1" }
            distal: { type: string, enum: ["0", "1", "2"], example: "0" }
            lingual: { type: string, enum: ["0", "1", "2"], example: "0" }
        corona: { type: boolean, example: false }
        extracted: { type: boolean, example: false }
        allcaries: { type: boolean, example: false }
        incurable: { type: boolean, example: false }
        malposition: { type: boolean, example: false }
        periodontal: { type: boolean, example: false }
        inscrustration: { type: boolean, example: false }

    AppointmentCreate:
      type: object
      required:
        - date
        - slots
        - typeAppointment
        - doctorID
        - patientID
        - status
      properties:
        date:
          type: string
          format: date
          description: "Fecha del turno (YYYY-MM-DD)"
          example: "2026-11-02"
        slots:
          $ref: "#/components/schemas/AppointmentSlots"
        typeAppointment:
          type: string
          enum: ["consulta", "cirugia", "control", "tratamiento"]
          example: "consulta"
        room:
          type: string
          description: "Consultorio"
          example: "Consultorio 1"
        doctorID:
          type: string
          example: "676491db50d8d925d49439cc"
        patientID:
          type: string
          example: "6797d8bda81e0d869ae05572"
        status:
          type: string
          description: "Un turno nuevo solo puede ser pending o confirmed; los demás estados se alcanzan con check-in, call, finalize y status"
          enum: ["pending", "confirmed"]
          example: "pending"
        observations:
          type: string
          maxLength: 500
          example: "Paciente debe traer exámenes previos"

    AppointmentUpdate:
      type: object
      description: >
        Campos editables del turno. Los demás campos del body se ignoran: el estado se cambia con
        check-in, call, finalize y status, la duración la fija el sistema y el odontograma se edita con /odontogram.
      required:
        - date
        - slots
        - typeAppointment
        - doctorID
        - patientID
      properties:
        date:
          type: string
          format: date
          example: "2026-11-02"
        slots:
          $ref: "#/components/schemas/AppointmentSlots"
        typeAppointment:
          type: string
          enum: ["consulta", "cirugia", "control", "tratamiento"]
        room:
          type: string
        doctorID:
          type: string
        patientID:
          type: string
        observations:
          type: string
          maxLength: 500

    AppointmentShortResponse:
      type: object
      description: "Turno con los datos de contacto del doctor y del paciente (listados y cambios de estado)"
      properties:
        id:
          type: string
        date:
          type: string
          format: date
          example: "2026-11-02"
        slots:
          $ref: "#/components/schemas/AppointmentSlots"
        duration:
          type: integer
          description: "Duración de cada slot en minutos, fijada al reservar"
          example: 30
        slotsText:
          type: string
          description: "Horario del turno"
          example: "14:00 - 15:00"
        typeAppointment:
          type: string
          enum: ["consulta", "cirugia", "control", "tratamiento"]
        room:
          type: string
        doctorID:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            lastName: { type: string }
            email: { type: string }
            dni: { type: string }
            phone: { type: string }
            frequency: { type: integer }
        patientID:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            lastName: { type: string }
            email: { type: string }
            dni: { type: string }
            phone: { type: string }
        status:
          $ref: "#/components/schemas/AppointmentStatus"

    AppointmentResponse:
      type: object
      description: "Turno completo, con el doctor y el paciente populados (sin el odontograma)"
      properties:
        id:
          type: string
        date:
          type: string
          format: date
          example: "2026-11-02"
        slots:
          $ref: "#/components/schemas/AppointmentSlots"
        duration:
          type: integer
          description: "Duración de cada slot en minutos, fijada al reservar"
          example: 30
        slotsText:
          type: string
          description: "Horario del turno"
          example: "14:00 - 15:00"
        typeAppointment:
          type: string
          enum: ["consulta", "cirugia", "control", "tratamiento"]
        room:
          type: string
        doctorID:
          type: object
          description: "Documento del doctor"
        patientID:
          type: object
          description: "Documento del paciente"
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        observations:
          type: string
        created:
          type: string
          format: date-time
        lastChange:
          type: string
          format: date-time

    AppointmentPage:
      type: object
      description: "Página de turnos (mongoose-paginate-v2)"
      properties:
        docs:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentShortResponse"
        totalDocs:
          type: integer
        limit:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean

    Availability:
      type: object
      properties:
        doctorID:
          type: string
          example: "676491db50d8d925d49439cc"
        frequency:
          type: integer
          description: "Frecuencia actual del doctor en minutos"
          example: 30
        from:
          type: string
          format: date
          example: "2026-11-01"
        to:
          type: string
          format: date
          example: "2026-11-30"
        days:
          type: array
          description: "Un elemento por cada día del rango, en orden"
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              status:
                type: string
                description: "closed: el doctor no atiende ese día o está inactivo. full: sin slots libres. available: con slots libres"
                enum: ["closed", "full", "available"]
              total:
                type: integer
                description: "Slots del horario del doctor ese día"
              occupied:
                type: integer
                description: "Slots que se superponen con algún turno activo"
              free:
                type: integer
                description: "Slots libres"
          example:
            - { date: "2026-11-01", status: "closed", total: 0, occupied: 0, free: 0 }
            - { date: "2026-11-02", status: "available", total: 18, occupied: 5, free: 13 }
            - { date: "2026-11-03", status: "full", total: 18, occupied: 18, free: 0 }

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: "JWT token almacenado en cookie HttpOnly"

security:
  - cookieAuth: []
