paths:
  # ==================== USERS ====================
  /api/users/:
    get:
      summary: "Obtener usuarios. Se pueden obtener en páginas"
      tags:
        - Users
      security:
        - cookieAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: "Búsqueda por apellido, nombre, email o dni"
          schema:
            type: string
        - name: rol
          in: query
          required: false
          description: "Filtro por rol"
          schema:
            type: string
            enum: ["admin", "doctor", "employee"]
        - name: sort
          in: query
          required: false
          description: "Ordenamiento por apellido (1=ASC, -1=DESC)"
          schema:
            type: integer
            enum: [1, -1]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: "Usuarios paginados obtenidos"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Success"
                  users:
                    type: object
                    properties:
                      docs:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserResponse"
                      totalDocs:
                        type: integer
                      limit:
                        type: integer
                      page:
                        type: integer
                      totalPages:
                        type: integer
                      hasNextPage:
                        type: boolean
                      hasPrevPage:
                        type: boolean
        "500":
          description: "Error en el servidor"

    post:
      summary: "Crear un nuevo usuario"
      description: >
        Si el rol es 'doctor', también crea su ficha en la colección Doctors. En ese caso son obligatorios
        dni, phone, professionalLicense, color y frequency (schedules es opcional: si no viene, se usan
        los horarios por defecto). Para otros roles, los campos de doctor se ignoran y no se validan.
      tags:
        - Users
      security:
        - cookieAuth: []
      requestBody:
        description: "Datos del usuario en formato JSON"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: "Usuario creado exitosamente"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Success"
                  user:
                    $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Datos inválidos, o faltan campos requeridos para un doctor"
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          example: "dni"
                        msg:
                          type: string
                          example: "El DNI es requerido para un doctor"
        "409":
          description: "Email, DNI o matrícula profesional ya registrados"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ERROR"
                  message:
                    type: string
                    example: "El email ya existe"
        "500":
          description: "Error en la creación"

  /api/users/{id}:
    get:
      summary: "Obtener un usuario por ID"
      tags:
        - Users
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del usuario"
          schema:
            type: string
      responses:
        "200":
          description: "Usuario encontrado"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Success"
                  users:
                    $ref: "#/components/schemas/UserResponse"
        "404":
          description: "Usuario no encontrado o dado de baja"
        "500":
          description: "Error en el servidor"

    put:
      summary: "Actualizar un usuario"
      description: >
        Actualización parcial: solo se modifican los campos enviados. El rol no se puede cambiar
        (si se envía, debe coincidir con el actual). La contraseña y el estado no se modifican por aquí.
        Si el usuario es doctor, los datos de cuenta y profesionales se sincronizan con la colección Doctors;
        si no lo es, los campos profesionales se ignoran.
      tags:
        - Users
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del usuario"
          schema:
            type: string
      requestBody:
        description: "Datos a actualizar"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
            example:
              name: "Juan Carlos"
              phone: "+5492612345678"
              frequency: 30
      responses:
        "200":
          description: "Usuario actualizado exitosamente"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Datos inválidos, o intento de cambiar el rol"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "No se permite cambiar el rol del usuario"
                      statusCode:
                        type: integer
                        example: 400
        "404":
          description: "Usuario no encontrado (o su ficha de doctor, si es doctor)"
        "409":
          description: "Email, DNI o matrícula profesional ya registrados. No se guarda ningún cambio"
        "500":
          description: "Error en el servidor"

    delete:
      summary: "Dar de baja un usuario"
      description: >
        Soft delete: no borra el usuario, lo deja con active en false (y a su ficha de doctor, si es doctor).
        Cierra su sesión: su próxima request responde 401. Un dado de baja no aparece en los listados,
        responde 404 por id y no puede volver a iniciar sesión. No se puede dar de baja a un doctor con
        turnos sin cerrar (pending, confirmed, waiting o called, de cualquier fecha). Roles: admin.
      tags:
        - Users
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "ID del usuario"
          schema:
            type: string
      responses:
        "200":
          description: "Usuario dado de baja exitosamente"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Success"
                  user:
                    $ref: "#/components/schemas/UserResponse"
        "404":
          description: "Usuario no encontrado o ya dado de baja"
        "409":
          description: "El doctor tiene turnos sin cerrar: hay que cancelarlos, reasignarlos o marcarlos como ausentes"
        "500":
          description: "Error en el servidor"

components:
  schemas:
    # ========== USER SCHEMAS ==========
    UserCreate:
      type: object
      required:
        - name
        - lastName
        - email
        - password
        - rol
      properties:
        name:
          type: string
          description: "Nombre del usuario"
          example: "John"
        lastName:
          type: string
          description: "Apellido del usuario"
          example: "Doe"
        email:
          type: string
          format: email
          description: "Email del usuario (debe ser único)"
          example: "john.doe@example.com"
        password:
          type: string
          format: password
          description: "Contraseña del usuario (se hashea automáticamente)"
          minLength: 8
          example: "securePassword123"
        rol:
          type: string
          enum: ["admin", "doctor", "employee"]
          description: "Rol del usuario en el sistema"
          example: "doctor"
        dni:
          type: string
          description: "Requerido si rol es 'doctor'. DNI (único)"
          example: "12345678"
        phone:
          type: string
          description: "Requerido si rol es 'doctor'. Teléfono"
          example: "+5492612345678"
        professionalLicense:
          type: string
          description: "Requerido si rol es 'doctor'. Matrícula profesional (única)"
          example: "MP12345"
        color:
          type: string
          description: "Requerido si rol es 'doctor'. Color hexadecimal en la agenda"
          example: "#8f897fff"
        frequency:
          type: integer
          minimum: 5
          maximum: 240
          description: "Requerido si rol es 'doctor'. Duración de cada turno, en minutos"
          example: 30
        schedules:
          $ref: "#/components/schemas/DoctorSchedules"

    UserUpdate:
      type: object
      description: "Todos los campos son opcionales: solo se actualizan los enviados"
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          description: "Nombre del usuario (solo letras y espacios)"
        lastName:
          type: string
          minLength: 3
          maxLength: 50
          description: "Apellido del usuario (solo letras y espacios)"
        email:
          type: string
          format: email
          description: "Email del usuario (único). Es el email de inicio de sesión"
        rol:
          type: string
          enum: ["admin", "doctor", "employee"]
          description: "No modifica el rol: si se envía, debe coincidir con el actual (sin distinguir mayúsculas)"
        dni:
          type: string
          description: "Solo doctores. DNI (único)"
        phone:
          type: string
          description: "Solo doctores. Teléfono"
        professionalLicense:
          type: string
          description: "Solo doctores. Matrícula profesional (única)"
        color:
          type: string
          description: "Solo doctores. Color hexadecimal en la agenda"
        frequency:
          type: integer
          minimum: 5
          maximum: 240
          description: "Solo doctores. Duración de cada turno, en minutos"
        schedules:
          $ref: "#/components/schemas/DoctorSchedules"

    UserResponse:
      type: object
      properties:
        id:
          type: string
          description: "ID único del usuario"
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          description: "Nombre del usuario"
          example: "John"
        lastName:
          type: string
          description: "Apellido del usuario"
          example: "Doe"
        email:
          type: string
          format: email
          description: "Email del usuario"
          example: "john.doe@example.com"
        rol:
          type: string
          enum: ["Admin", "Doctor", "Employee"]
          description: "Rol del usuario en el sistema"
          example: "Doctor"
        active:
          type: boolean
          description: "false = dado de baja (soft delete). La API no devuelve usuarios dados de baja"
          example: true
