name: backend-clinica-dev
services:
  # ==========================================
  # SESIONES (REDIS)
  # ==========================================
  redis_clinica:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - network_backend_clinica

  # ==========================================
  # BASE DE DATOS PRINCIPAL (Mongo)
  # ==========================================
  mongo_clinica:
    image: mongo:7
    restart: unless-stopped
    # Replica set de un nodo: habilita transacciones.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_clinica_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - network_backend_clinica
    # Inicia el replica set la primera vez y queda healthy cuando hay un primario que acepta escrituras.
    # El miembro se anuncia como mongo_clinica:27017 porque la API corre en otro contenedor de la red.
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status() }
        catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo_clinica:27017' }] }) }
        quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s


  # ==========================================
  # MONOLITO NODE 
  # ==========================================
  app_clinica:
    ports:
      - "8080:8080"
    build:
      context: ..         # Sube un nivel a la raíz para encontrar el código
      dockerfile: docker/dockerfile.dev  # Ruta al Dockerfile desde la raíz
    restart: unless-stopped
    env_file:
      - .env.development  # Carga las variables automáticamente en el contenedor
    command: pnpm dev
    volumes:
      - ../:/app
      - /app/node_modules
    depends_on:
      redis_clinica:
        condition: service_started
      # Espera a que el replica set esté iniciado: sin él fallan las transacciones
      mongo_clinica:
        condition: service_healthy
    networks:
      - network_backend_clinica # Para hablar con la DB y Redis

  # ==========================================
  # MICROSERVICIO PDF 
  # ==========================================
  pdf-service:
    build:
      context: ../pdf-service
      dockerfile: Dockerfile
    container_name: clinic-pdf-service
    volumes:
      - ../pdf-service:/app
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - network_backend_clinica


# ==========================================
# CONFIGURACIÓN DE REDES Y VOLÚMENES
# ==========================================
networks:
  network_backend_clinica:
    driver: bridge

volumes:
  redis_data:
  mongo_clinica_data: