name: backend-clinica-dev
services:
  # ==========================================
  # SESIONES (REDIS)
  # ==========================================
  redis_clinica:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - network_backend_clinica

  # ==========================================
  # BASE DE DATOS PRINCIPAL (Mongo)
  # ==========================================
  mongo_clinica:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_clinica_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - network_backend_clinica


  # ==========================================
  # MONOLITO NODE 
  # ==========================================
  app_clinica:
    ports:
      - "8080:8080"
    build:
      context: ..         # Sube un nivel a la raíz para encontrar el código
      dockerfile: docker/dockerfile.dev  # Ruta al Dockerfile desde la raíz
    restart: unless-stopped
    env_file:
      - .env.development  # Carga las variables automáticamente en el contenedor
    command: pnpm dev
    volumes:
      - ../:/app
      - /app/node_modules
    depends_on:
      - redis_clinica
      - mongo_clinica
    networks:
      - network_backend_clinica # Para hablar con la DB y Redis

  # ==========================================
  # MICROSERVICIO PDF 
  # ==========================================
  pdf-service:
    build:
      context: ../pdf-service
      dockerfile: Dockerfile
    container_name: clinic-pdf-service
    volumes:
      - ../pdf-service:/app
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - network_backend_clinica


# ==========================================
# CONFIGURACIÓN DE REDES Y VOLÚMENES
# ==========================================
networks:
  network_backend_clinica:
    driver: bridge

volumes:
  redis_data:
  mongo_clinica_data: